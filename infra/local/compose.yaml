# Local dependencies for Stackfi. The API and worker run on the host (see docs/decisions/0002).
#
#   cp infra/local/.env.example infra/local/.env     # once, then edit if you like
#   docker compose -f infra/local/compose.yaml up -d
#   docker compose -f infra/local/compose.yaml ps    # all services should be "healthy"
#
# Every port is bound to 127.0.0.1, so nothing is reachable from outside this machine.

name: stackfi

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/local/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/local/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/local/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent folder.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # The "-management" variant adds the web UI at http://localhost:15672
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in infra/local/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/local/.env}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP, used by the API and worker
      - "127.0.0.1:15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10-alpine
    # No password locally (localhost-only port). Production (ElastiCache) uses auth and TLS.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    # S3-compatible object storage, standing in for AWS S3 locally (see docs/decisions/0003).
    # "server" runs SeaweedFS's master, volume and filer in one container; "-s3" adds the S3 API.
    image: chrislusf/seaweedfs:4.53
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333"]
    environment:
      # Without these, SeaweedFS accepts ANY access key. With them, only this pair works.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in infra/local/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in infra/local/.env}
    ports:
      - "127.0.0.1:8333:8333"     # S3 API endpoint
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  seaweedfs-data:
